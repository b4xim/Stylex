# ==============================================================================
# StyleX Signature Salon - Master Nginx Gateway Configuration
# Domains: stylexsalon.in (Customer Site) & dashboard.stylexsalon.in (Admin SPA)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Dashboard Subdomain (dashboard.stylexsalon.in)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name dashboard.stylexsalon.in;
    client_max_body_size 50M;

    # Docker internal DNS resolver (prevents crash if api container is restarting)
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_api http://api:5000;

    # ACME Challenge for Let's Encrypt SSL Certificates
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # API Proxy
    location /api/ {
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Uploads Storage
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Admin Dashboard SPA Root
    location / {
        root /usr/share/nginx/html/admin;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# ------------------------------------------------------------------------------
# 2. Main Customer Website (stylexsalon.in, www.stylexsalon.in, and IP fallback)
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name stylexsalon.in www.stylexsalon.in _;
