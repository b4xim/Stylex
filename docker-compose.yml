services:
  # 1. PostgreSQL 16 Relational Database Engine
  postgres:
    image: postgres:16-alpine
    container_name: stylex_postgres
    restart: always
    environment:
      POSTGRES_DB: stylex_salon
      POSTGRES_USER: stylex_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stylex_secure_pass_2026}
    volumes:
      - stylex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stylex_admin -d stylex_salon"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stylex_network

  # 2. Node.js + Express + Prisma API Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stylex_api
    restart: always
    shm_size: '1gb'
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://stylex_admin:${POSTGRES_PASSWORD:-stylex_secure_pass_2026}@postgres:5432/stylex_salon?schema=public
      NODE_ENV: production
      PORT: 5000
    volumes:
      - stylex_uploads:/app/uploads
      - stylex_whatsapp_auth:/app/whatsapp-auth
      - stylex_nginx_logs:/var/log/nginx:ro
      - stylex_goaccess_data:/app/analytics-data
    networks:
      - stylex_network

  # 3. High-Performance Nginx Reverse Proxy & Static Asset Gateway
  nginx:
    image: nginx:alpine
    container_name: stylex_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./dist:/usr/share/nginx/html/client:ro
      - ./Stylex_Dashboard/dist:/usr/share/nginx/html/admin:ro
      - stylex_uploads:/usr/share/nginx/html/uploads:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - stylex_nginx_logs:/var/log/nginx
    networks:
      - stylex_network

  # 4. GoAccess Real-Time Web Log Analytics
  goaccess:
    image: allinurl/goaccess:latest
    container_name: stylex_goaccess
    restart: always
    volumes:
      - stylex_nginx_logs:/var/log/nginx:ro
      - stylex_goaccess_data:/var/www/goaccess
    command: >
      goaccess /var/log/nginx/stylex_access.log
      -o /var/www/goaccess/index.html
      --log-format=COMBINED
      --real-time-html
      --anonymize-ip
      --ignore-crawlers
    networks:
      - stylex_network

networks:
  stylex_network:
    driver: bridge

volumes:
  stylex_pgdata:
    name: stylex_pgdata
  stylex_uploads:
    name: stylex_uploads
  stylex_whatsapp_auth:
    name: stylex_whatsapp_auth
  stylex_nginx_logs:
    name: stylex_nginx_logs
  stylex_goaccess_data:
    name: stylex_goaccess_data
